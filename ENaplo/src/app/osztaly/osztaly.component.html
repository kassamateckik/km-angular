    @for (t of tanulok; track $index) {
        <li>
            <app-tanulo [nev]="t.nev" [hianyzik]="t.hianyzik" [jegyek]="t.jegyek" (jegyBeirva)="jegyBeiras($event)" (hianyzasValtozott)="hianyzasValtozott($event)"/>
        </li>
    }
</ul>
