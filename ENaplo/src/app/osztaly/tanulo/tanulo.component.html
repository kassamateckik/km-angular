@if (hianyzik) {
    <div class="hianyzo">
        <p>Igazolatlan hiányzás.</p>
        <input type="button" value="Hiányzás Módosítása" (click)="modosit()">
    </div>
}
@else{
    <div >
        <input type="number" [(ngModel)]="ujJegy" min="1" max="5" >
        <input type="button" value="Jegy beírása" (click)="hozzaad()" >
        <input type="button" value="Hiányzás Módosítása" (click)="modosit()">
        @if (2 > atlag) {
            <p class="piros">Bukásra áll</p>
        }
    </div>
}
