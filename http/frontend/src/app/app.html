@if (errorMessage()) {
  <p>{{ errorMessage() }}</p>
}

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Név</th>
      <th>Születési dátum</th>
      <th>Műveletek</th>
    </tr>
  </thead>
  <tbody>
    @for (person of people(); track person.id) {
      <tr>
        <td>{{ person.id }}</td>
        @if (editingId() === person.id) {
          <td>
            <input
              type="text"
              [(ngModel)]="editName"
              (keydown.enter)="saveEdit(person.id)"
            />
          </td>
          <td>
            <input
              type="date"
              [(ngModel)]="editBirthDate"
              (keydown.enter)="saveEdit(person.id)"
            />
          </td>
          <td>
            <button type="button" (click)="saveEdit(person.id)">Mentés</button>
            <button type="button" (click)="cancelEdit()">Mégse</button>
          </td>
        } @else {
          <td>{{ person.name }}</td>
          <td>{{ person.birthDate }}</td>
          <td>
            <button type="button" (click)="startEdit(person)">Módosítás</button>
            <button type="button" (click)="deletePerson(person.id)">Törlés</button>
          </td>
        }
      </tr>
    }
    <tr>
      <td></td>
      <td>
        <input
          type="text"
          [(ngModel)]="newName"
          placeholder="Név"
          (keydown.enter)="addPerson()"
        />
      </td>
      <td>
        <input
          type="date"
          [(ngModel)]="newBirthDate"
          (keydown.enter)="addPerson()"
        />
      </td>
      <td>
        <button type="button" (click)="addPerson()">Hozzáadás</button>
      </td>
    </tr>
  </tbody>
</table>
