<h1>Szülőszoba</h1>

ID:
<input type="number" [(ngModel)]="ujId"><br>

Név:
<input type="text" [(ngModel)]="ujNev"><br>

MaxHp:
<input type="number" [(ngModel)]="ujMaxHp"><br>

Támadás:
<input type="number" [(ngModel)]="ujTamadas"><br>

<input type="button" value="Létrehozás" (click)="ujGladiator()">

<hr>

@for (gladiator of gladiatorok; track $index) {
  <app-gladiator [gladiator]="gladiator" [inArena]="false" (katt)="kattintas($event)" [szines]="legtobbGyozelem == gladiator.gyozelmek"/>  
}

<hr>

@if (kivalasztottak.length == 2) {
  <!-- <app-arena [harcos1]="kivalasztottak[0]" [harcos2]="kivalasztottak[1]"/> -->
  <app-arena [h]="kivalasztottak" (eredmeny)="kihirdet($event)"/>
}
