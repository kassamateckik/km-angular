<div [ngClass]="{'cssClass': allapot()}" class="kartya" (click)="kattintas()">
    <p>Név: {{gladiator!.nev}}</p>
    <p>HP: {{gladiator!.hp}}</p>
    <p>Támadás: {{gladiator!.tamadas}}</p>

    @if (gladiator!.hp == 0 && inArena){
        <input type="button" value="👍" (click)="dont(true)">
        <input type="button" value="👎" (click)="dont(false)">
    }
</div>
