<button routerLink="/">Kezdőlap</button>

@if (authService.isLoggedIn()){
    <button routerLink="/" (click)="logout()">Kijelentkezés</button>
    <button routerLink="/admin/details">Részletek</button>
    <button routerLink="/admin/profile">Profil</button>
}
@else {
    <button routerLink="/login">Bejelentkezés</button>
}
